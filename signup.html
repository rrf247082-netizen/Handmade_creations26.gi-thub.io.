<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up | Handmade Creations 26</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="top-bar">🌸 Join Handmade Creations 26</div>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="Handmade Creations 26"></a>
      <nav class="header-icons"><a href="shop.html">🛍 Shop</a></nav>
    </div>
  </header>

  <main class="container" style="padding:40px 0;display:flex;justify-content:center">
    <div style="max-width:520px;width:100%;background:#fff;padding:20px;border-radius:12px;box-shadow:var(--card-shadow)">
      <h1 style="color:var(--accent);margin-top:0">Create an Account</h1>
      <p style="color:var(--muted)">Sign up to save your wishlist, track orders and checkout faster.</p>

      <form id="signupForm" style="display:flex;flex-direction:column;gap:10px">
        <input id="fullname" type="text" placeholder="Full Name" required>
        <input id="signupEmail" type="email" placeholder="Email Address" required>
        <input id="phone" type="tel" placeholder="Phone Number">
        <input id="signupPassword" type="password" placeholder="Password" required>
        <input id="confirmPassword" type="password" placeholder="Confirm Password" required>
        <button type="submit" class="btn">Create Account</button>
        <p style="text-align:center">Already have an account? <a href="login.html" style="color:var(--accent)">Login</a></p>
      </form>
    </div>
  </main>

  <script type="module" src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
