<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout | Handmade Creations 26</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="top-bar">🌸 Secure Checkout — Handmade Creations 26</div>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="Handmade Creations 26"></a>
      <nav class="header-icons"><a href="shop.html">🛍 Shop</a></nav>
    </div>
  </header>

  <main class="container" style="padding:40px 0;">
    <h1 style="text-align:center;color:var(--accent);margin-bottom:24px">Checkout</h1>

    <div style="display:grid;grid-template-columns:1fr 360px;gap:24px;max-width:1100px;margin:0 auto;">
      <form id="checkoutForm" style="background:#fff;padding:16px;border-radius:12px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:12px">
        <h3 style="color:var(--accent);margin-top:0">Billing & Shipping Details</h3>
        <input id="fullName" type="text" placeholder="Full Name" required>
        <input id="email" type="email" placeholder="Email Address" required>
        <input id="phone" type="tel" placeholder="Phone Number" required>
        <textarea id="address" placeholder="Shipping Address" required></textarea>
        <div style="display:flex;gap:8px">
          <input id="city" type="text" placeholder="City" required>
          <input id="pincode" type="text" placeholder="Pincode" required style="width:140px">
        </div>
        <h4 style="color:var(--accent);margin:0">Payment Method</h4>
        <select id="paymentMethod" required>
          <option>Cash on Delivery</option>
          <option>UPI</option>
          <option>Card</option>
        </select>

        <div style="display:flex;gap:8px">
          <button type="submit" class="btn">Place Order</button>
          <a href="cart.html" class="btn btn-outline" style="align-self:center">Back to Cart</a>
        </div>
      </form>

      <aside style="background:#fff;padding:16px;border-radius:12px;box-shadow:var(--card-shadow)">
        <h3 style="color:var(--accent);margin-top:0">Order Summary</h3>
        <div id="summaryItems"></div>
        <p>Items: <span id="summaryCount">0</span></p>
        <p>Subtotal: ₹<span id="summaryTotal">0.00</span></p>
        <p>Shipping: ₹<span id="summaryShipping">49.00</span></p>
        <hr>
        <p style="font-weight:700">Total: ₹<span id="summaryGrand">0.00</span></p>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid"><div><h3>Handmade Creations 26</h3></div></div>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
