<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart | Handmade Creations 26</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="top-bar">🌸 Your Cart — Handmade Creations 26</div>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="Handmade Creations 26"></a>
      <nav class="header-icons">
        <a href="shop.html">🛍 Shop</a>
        <a href="wishlist.html">❤️ Wishlist</a>
        <a href="login.html">👤 Login</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:40px 0;">
    <h1 style="text-align:center;color:var(--accent);margin-bottom:24px;">My Cart</h1>

    <div id="cartContainer" style="display:grid;grid-template-columns:1fr 360px;gap:24px;max-width:1100px;margin:0 auto;">
      <div id="cartItems" style="display:flex;flex-direction:column;gap:16px">
        <!-- cart items rendered by script.js -->
      </div>

      <aside id="cartSummary" style="background:#fff;padding:16px;border-radius:12px;box-shadow:var(--card-shadow)">
        <h3 style="color:var(--accent);margin-top:0">Order Summary</h3>
        <p>Items: <span id="itemCount">0</span></p>
        <p style="font-weight:700">Total: ₹<span id="cartTotal">0.00</span></p>

        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          <select id="paymentMethod">
            <option>Cash on Delivery</option>
            <option>UPI</option>
            <option>Card</option>
          </select>
          <button id="checkoutBtn" class="btn">Proceed to Checkout</button>
          <a href="shop.html" class="btn btn-outline" style="text-align:center">Continue Shopping</a>
        </div>
      </aside>
    </div>

    <div id="emptyCart" style="display:none;text-align:center;margin-top:28px">
      <h2>Your cart is empty 💔</h2>
      <p>Add items to your cart to see them here.</p>
      <a href="shop.html" class="btn" style="margin-top:12px">Continue Shopping</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div><h3>Handmade Creations 26</h3></div>
      <div><h4>Quick Links</h4><a href="index.html">Home</a></div>
      <div><h4>Follow Us</h4><a href="#">Instagram</a></div>
    </div>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
