<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Handmade Creations 26</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f5f5f5;
        }

        .admin{
            display:flex;
            min-height:100vh;
        }

        .sidebar{
            width:260px;
            background:#6a1b9a;
            color:#fff;
            padding:20px;
        }

        .sidebar h2{
            text-align:center;
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            color:#fff;
            text-decoration:none;
            padding:12px;
            margin-bottom:10px;
            border-radius:8px;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,.2);
        }

        .content{
            flex:1;
            padding:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#fff;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 12px rgba(0,0,0,.1);
        }

        .card h3{
            margin:0;
            color:#666;
        }

        .card h2{
            margin-top:10px;
            color:#6a1b9a;
        }
    </style>
</head>

<body>

<div class="admin">

<div class="sidebar">

<h2>🌸 Handmade Creations 26</h2>

<a href="#">📊 Dashboard</a>

<a href="#">📦 Orders</a>

<a href="#">🛍 Products</a>

<a href="#">👥 Customers</a>

<a href="#">⚙ Settings</a>

<a href="index.html">🏠 Back to Website</a>

</div>

<div class="content">

<h1>Admin Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Orders</h3>
<h2 id="totalOrders">0</h2>
</div>

<div class="card">
<h3>Total Products</h3>
<h2 id="totalProducts">0</h2>
</div>

<div class="card">
<h3>Total Customers</h3>
<h2 id="totalCustomers">0</h2>
</div>

<div class="card">
<h3>Total Sales</h3>
<h2 id="totalSales">₹0</h2>
</div>

</div>
    <div class="card" style="margin-bottom:20px;">
  <h2>➕ Add Product</h2>

  <input type="text" id="productName" placeholder="Product Name"><br><br>

  <input type="number" id="productPrice" placeholder="Price"><br><br>

  <input type="text" id="productImage" placeholder="Image URL (e.g. images/product7.jpg)"><br><br>

  <button id="addProductBtn">Add Product</button>
    </div>
    <h2 style="margin-top:40px;">📦 Recent Orders</h2>

<div class="card">

<table style="width:100%;border-collapse:collapse;">

<thead>

<tr style="background:#f3f3f3;">
<th style="padding:12px;text-align:left;">Order ID</th>
<th style="padding:12px;text-align:left;">Customer</th>
<th style="padding:12px;text-align:left;">Payment</th>
<th style="padding:12px;text-align:left;">Total</th>
<th style="padding:12px;text-align:left;">Status</th>
</tr>

</thead>

<tbody id="ordersTable">

<tr>

<td colspan="5" style="padding:20px;text-align:center;">
Loading orders...
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
