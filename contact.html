<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us | Handmade Creations 26</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="top-bar">🌸 We'd Love to Hear From You</div>

  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="Handmade Creations 26"></a>
      <nav class="header-icons"><a href="shop.html">🛍 Shop</a></nav>
    </div>
  </header>

  <main class="container" style="padding:40px 0;">
    <h1 style="color:var(--accent);text-align:center;margin-bottom:18px">Contact Us</h1>

    <div class="grid" style="grid-template-columns:2fr 1fr;gap:20px;max-width:1100px;margin:0 auto">
      <section style="background:#fff;padding:16px;border-radius:12px;box-shadow:var(--card-shadow)">
        <h2 style="color:var(--accent);margin-top:0">Send Us a Message</h2>
        <form id="contactForm" style="display:flex;flex-direction:column;gap:10px">
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Your Email" required>
          <input type="tel" placeholder="Phone Number">
          <textarea rows="6" placeholder="Write your message..." required></textarea>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </section>

      <aside style="background:#fff;padding:16px;border-radius:12px;box-shadow:var(--card-shadow)">
        <h2 style="color:var(--accent);margin-top:0">Our Information</h2>
        <p>📍 Kerala, India</p>
        <p>📞 +91 XXXXX XXXXX</p>
        <p>📧 handmadecreations26@gmail.com</p>
        <p>🕒 Mon—Sat: 9:00 AM — 7:00 PM</p>
        <div style="margin-top:12px">
          <a href="#">📸 Instagram</a><br>
          <a href="#">📘 Facebook</a><br>
          <a href="#">💬 WhatsApp</a>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer"><div class="container footer-grid"><div><h3>Handmade Creations 26</h3></div></div></footer>

  <script type="module" src="script.js"></script>
</body>
</html>
